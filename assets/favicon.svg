<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="grad-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="grad-center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>
  <!-- Connection lines -->
  <line x1="32" y1="32" x2="14" y2="14" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round" />
  <line x1="32" y1="32" x2="50" y2="14" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" />
  <line x1="32" y1="32" x2="14" y2="50" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round" />
  <line x1="32" y1="32" x2="32" y2="54" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" />
  <line x1="32" y1="32" x2="52" y2="44" stroke="#EF4444" stroke-width="4.5" stroke-linecap="round" />
  <!-- Nodes -->
  <circle cx="14" cy="14" r="7" fill="url(#grad-blue)" />
  <circle cx="50" cy="14" r="7.5" fill="url(#grad-orange)" />
  <circle cx="14" cy="50" r="7.5" fill="url(#grad-blue)" />
  <circle cx="32" cy="54" r="6" fill="url(#grad-green)" />
  <circle cx="52" cy="44" r="5" fill="url(#grad-red)" />
  <!-- Central Hub -->
  <circle cx="32" cy="32" r="9.5" fill="url(#grad-center)" />
